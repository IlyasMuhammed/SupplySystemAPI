<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<sf-page [crumbs]="['Procurement', 'Business partners']">
  <div sfCmd class="sf-cmd" role="toolbar" aria-label="Commands">
    <p-button label="New partner" icon="pi pi-plus" routerLink="/portal/pages/suppliers/partner-create"
              data-testid="new-partner"></p-button>
    <span class="sf-sep"></span>
    <p-button icon="pi pi-refresh" label="Reset filters" [text]="true" (onClick)="resetFilters()"></p-button>
  </div>

  <div class="sf-body">
    <!-- Type filter chips (Addendum 29 §1.6) — pure filter selectors, the table below is the only
         content; switching re-queries with the matching is_vendor/is_customer/etc. flag. -->
    <div class="sf-lr-head">
      <div>
        <h1>Business partners <span class="sf-count">{{ totalRecords }}</span></h1>
        <div class="sf-sub">Vendors, customers, carriers and service providers — one record per relationship</div>
      </div>
      <div class="sf-filters" role="tablist" data-testid="type-tabs">
        <button *ngFor="let tab of tabOptions; let i = index" type="button" role="tab" class="sf-chip"
                [class.on]="activeTabIndex === i" [attr.aria-selected]="activeTabIndex === i"
                (click)="onTabChange(i)">
          <i [class]="tab.icon"></i>{{ tab.label }}
        </button>
      </div>
    </div>

    <div class="sf-filters">
      <p-iconfield class="sf-search">
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" [(ngModel)]="searchText" (ngModelChange)="onSearchChange()"
               placeholder="Search by name or code..." data-testid="search" />
      </p-iconfield>
    </div>

    <div class="sf-card p0">
      <p-table
        [value]="partners"
        [loading]="isLoading"
        [tableStyle]="{'min-width': '60rem'}"
        [rows]="pageSize"
        [paginator]="true"
        [lazy]="true"
        [totalRecords]="totalRecords"
        [rowsPerPageOptions]="[10, 20, 50]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} partners"
        (onPage)="onPageChange($event)"
        data-testid="partner-table">

        <ng-template pTemplate="header">
          <tr>
            <th>Company</th>
            <th>Code</th>
            <th>Type</th>
            <th>Status</th>
            <th *ngIf="qboAvailable()">QuickBooks</th>
            <th style="width:8rem"></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-partner>
          <tr>
            <td><a [routerLink]="['/portal/pages/suppliers/partner-detail', partner.uuid]"><strong>{{ partner.companyName }}</strong></a></td>
            <td><span class="sf-mono sf-mu">{{ partner.partnerCode || '—' }}</span></td>
            <td>
              <span class="type-tags">
                <p-tag *ngFor="let t of partnerTypeTags(partner)" [value]="t.label" [severity]="t.severity"></p-tag>
              </span>
            </td>
            <td>
              <p-tag [value]="partner.isActive ? 'Active' : 'Inactive'"
                     [severity]="partner.isActive ? 'success' : 'secondary'"></p-tag>
            </td>
            <td *ngIf="qboAvailable()">
              <span class="type-tags">
                <app-qbo-sync-badge *ngIf="partner.isCustomer" kind="Customer" [externalId]="partner.uuid" label="Customer"></app-qbo-sync-badge>
                <app-qbo-sync-badge *ngIf="partner.isVendor" kind="Vendor" [externalId]="partner.uuid" label="Vendor"></app-qbo-sync-badge>
              </span>
            </td>
            <td>
              <p-button
                icon="pi pi-eye"
                size="small"
                [text]="true"
                severity="secondary"
                pTooltip="View Details"
                [routerLink]="['/portal/pages/suppliers/partner-detail', partner.uuid]">
              </p-button>
              <p-button
                icon="pi pi-pencil"
                size="small"
                [text]="true"
                severity="secondary"
                pTooltip="Edit"
                [routerLink]="['/portal/pages/suppliers/partner-edit', partner.uuid]">
              </p-button>
              <p-button
                icon="pi pi-trash"
                size="small"
                severity="danger"
                [text]="true"
                pTooltip="Delete"
                (onClick)="confirmDelete(partner)">
              </p-button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td [attr.colspan]="qboAvailable() ? 6 : 5" class="sf-empty">
              No business partners found for this filter.
              <a routerLink="/portal/pages/suppliers/partner-create">Add one.</a>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</sf-page>
