<sf-page [crumbs]="['Settings', 'Cities']">
  <!-- ── Command bar ───────────────────────────────────────────────────────── -->
  <div sfCmd class="sf-cmd" role="toolbar" aria-label="Commands">
    <p-button label="Add City" icon="pi pi-plus"
              routerLink="/portal/pages/cities/cities-create">
    </p-button>
  </div>

  <div class="sf-body">
  <div class="sf-lr-head">
    <div>
      <h1>Cities <span class="sf-count" *ngIf="!isLoading">{{ cities.length }}</span></h1>
      <div class="sf-sub">Manage city master data linked to countries</div>
    </div>
  </div>

  <!-- ── Search Bar ────────────────────────────────────────────────────────── -->
  <div class="sf-filters">
    <p-iconfield class="sf-search">
      <p-inputicon styleClass="pi pi-search" />
      <input #gf pInputText type="text"
             (input)="dt.filterGlobal(gf.value, 'contains')"
             placeholder="Search cities…" />
    </p-iconfield>
  </div>

  <!-- ── Data Table ────────────────────────────────────────────────────────── -->
  <div class="sf-card p0">
  <p-table
    #dt
    [value]="cities"
    [loading]="isLoading"
    [paginator]="true"
    [rows]="15"
    [rowsPerPageOptions]="[10, 15, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} of {totalRecords}"
    [globalFilterFields]="['name', 'countryName']"
    [rowHover]="true"
    dataKey="id"
    responsiveLayout="scroll">

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name">City Name <p-sortIcon field="name"></p-sortIcon></th>
        <th pSortableColumn="countryName">Country <p-sortIcon field="countryName"></p-sortIcon></th>
        <th style="width: 8rem">Status</th>
        <th style="width: 8rem">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-city>
      <tr>
        <td class="font-medium">{{ city.name }}</td>
        <td>
          <span class="md-country-badge" *ngIf="city.countryName">
            <i class="pi pi-globe"></i> {{ city.countryName }}
          </span>
          <span class="sf-mu" *ngIf="!city.countryName">—</span>
        </td>
        <td>
          <p-tag [value]="city.isActive ? 'Active' : 'Inactive'"
                 [severity]="city.isActive ? 'success' : 'danger'">
          </p-tag>
        </td>
        <td>
          <ng-container *ngIf="canEditOrDelete; else noAccess">
            <button pButton icon="pi pi-pencil"
                    class="p-button-rounded p-button-text p-button-sm mr-1"
                    pTooltip="Edit" tooltipPosition="top"
                    [routerLink]="['/portal/pages/cities/cities-create', city.id]">
            </button>
            <button pButton icon="pi pi-trash"
                    class="p-button-rounded p-button-text p-button-danger p-button-sm"
                    pTooltip="Delete" tooltipPosition="top"
                    (click)="onDelete(city)">
            </button>
          </ng-container>
          <ng-template #noAccess>—</ng-template>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="sf-empty">
          No cities found<br />
          <small>Click "Add City" to create one.</small>
        </td>
      </tr>
    </ng-template>

  </p-table>
  </div>
  </div>
</sf-page>

<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
