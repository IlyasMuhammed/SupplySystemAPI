<sf-page [crumbs]="['Settings', 'Countries']">
  <!-- ── Command bar ───────────────────────────────────────────────────────── -->
  <div sfCmd class="sf-cmd" role="toolbar" aria-label="Commands">
    <p-button label="Add Country" icon="pi pi-plus"
              routerLink="/portal/pages/countries/countries-create">
    </p-button>
  </div>

  <div class="sf-body">
  <div class="sf-lr-head">
    <div>
      <h1>Countries <span class="sf-count" *ngIf="!isLoading">{{ countries.length }}</span></h1>
      <div class="sf-sub">Manage country master data used across the system</div>
    </div>
  </div>

  <!-- ── Search Bar ────────────────────────────────────────────────────────── -->
  <div class="sf-filters">
    <p-iconfield class="sf-search">
      <p-inputicon styleClass="pi pi-search" />
      <input #gf pInputText type="text"
             (input)="dt.filterGlobal(gf.value, 'contains')"
             placeholder="Search countries…" />
    </p-iconfield>
  </div>

  <!-- ── Data Table ────────────────────────────────────────────────────────── -->
  <div class="sf-card p0">
  <p-table
    #dt
    [value]="countries"
    [loading]="isLoading"
    [paginator]="true"
    [rows]="15"
    [rowsPerPageOptions]="[10, 15, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} of {totalRecords}"
    [globalFilterFields]="['name', 'code']"
    [rowHover]="true"
    dataKey="id"
    responsiveLayout="scroll">

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name">Country Name <p-sortIcon field="name"></p-sortIcon></th>
        <th pSortableColumn="code" style="width: 9rem">Code <p-sortIcon field="code"></p-sortIcon></th>
        <th style="width: 8rem">Status</th>
        <th style="width: 8rem">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-country>
      <tr>
        <td class="font-medium">{{ country.name }}</td>
        <td>
          <span class="md-code" *ngIf="country.code">{{ country.code }}</span>
          <span class="sf-mu" *ngIf="!country.code">—</span>
        </td>
        <td>
          <p-tag [value]="country.isActive ? 'Active' : 'Inactive'"
                 [severity]="country.isActive ? 'success' : 'danger'">
          </p-tag>
        </td>
        <td>
          <ng-container *ngIf="canEditOrDelete; else noAccess">
            <button pButton icon="pi pi-pencil"
                    class="p-button-rounded p-button-text p-button-sm mr-1"
                    pTooltip="Edit" tooltipPosition="top"
                    (click)="onEdit(country)">
            </button>
            <button pButton icon="pi pi-trash"
                    class="p-button-rounded p-button-text p-button-danger p-button-sm"
                    pTooltip="Delete" tooltipPosition="top"
                    (click)="onDelete(country)">
            </button>
          </ng-container>
          <ng-template #noAccess>—</ng-template>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="sf-empty">
          No countries found<br />
          <small>Click "Add Country" to create one.</small>
        </td>
      </tr>
    </ng-template>

  </p-table>
  </div>
  </div>
</sf-page>

<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
