<p-toast></p-toast>

<sf-page [crumbs]="['Material', 'Projects', isEditMode ? 'Edit project' : 'New project']">
  <header class="sf-hdr sf-compact">
    <div class="grow">
      <h1>{{ isEditMode ? 'Edit project' : 'New project' }}</h1>
      <div class="sf-meta">{{ isEditMode ? 'Update project details' : 'Create a new project record' }}</div>
    </div>
    <p-button label="Back to Projects" icon="pi pi-arrow-left" [text]="true" severity="secondary"
              routerLink="/portal/pages/material/projects"></p-button>
  </header>

  <div class="sf-body">
    <section class="sf-card" *ngIf="!isLoading">
      <div class="sf-ch"><h2>Project details</h2></div>

      <div class="sf-fields">
        <div class="sf-fld" *ngIf="!isEditMode">
          <label class="sf-req">Project Code</label>
          <input pInputText [(ngModel)]="projectCode" placeholder="e.g. PRJ-001"
                 style="text-transform:uppercase;width:100%" />
        </div>

        <div class="sf-fld">
          <label class="sf-req">Project Name</label>
          <input pInputText [(ngModel)]="projectName" placeholder="Project name" style="width:100%" />
        </div>

        <div class="sf-fld">
          <label>Project Manager</label>
          <p-dropdown [(ngModel)]="projectManagerId"
                      [options]="userOptions"
                      optionLabel="label" optionValue="value"
                      placeholder="Select project manager"
                      [filter]="true" filterBy="label"
                      [showClear]="true"
                      styleClass="w-full"></p-dropdown>
        </div>

        <div class="sf-fld">
          <label>Budget Amount</label>
          <p-inputNumber [(ngModel)]="budgetAmount" mode="decimal"
                         [minFractionDigits]="2" [maxFractionDigits]="2"
                         placeholder="0.00" styleClass="w-full"></p-inputNumber>
        </div>

        <div class="sf-fld" *ngIf="isEditMode">
          <label>Status</label>
          <p-dropdown [(ngModel)]="selectedStatus"
                      [options]="statusOptions"
                      optionLabel="label" optionValue="value"
                      styleClass="w-full"></p-dropdown>
        </div>

        <div class="sf-fld full-width">
          <label>Description</label>
          <textarea pTextarea [(ngModel)]="description" rows="4"
                    placeholder="Project description..." style="width:100%"></textarea>
        </div>
      </div>
    </section>

    <div class="sf-empty" *ngIf="isLoading">
      <i class="pi pi-spin pi-spinner"></i> Loading project...
    </div>
  </div>

  <div class="sf-fbar" *ngIf="!isLoading">
    <span class="sf-mu sf-sm">Fields marked * are required.</span>
    <span class="sf-end">
      <p-button label="Cancel" icon="pi pi-times" [text]="true" severity="secondary"
                routerLink="/portal/pages/material/projects"></p-button>
      <p-button [label]="isEditMode ? 'Save Changes' : 'Create Project'"
                icon="pi pi-check"
                [loading]="isSaving" (onClick)="onSubmit()"></p-button>
    </span>
  </div>
</sf-page>
